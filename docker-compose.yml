services:
  xray:
    image: teddysun/xray:latest
    container_name: wasm-tunnel-xray
    restart: unless-stopped
    ports:
      - "${XRAY_PORT:-8080}:8080"
    environment:
      XRAY_UUID: ${XRAY_UUID:?Copy .env.example to .env and set XRAY_UUID}
      WS_PATH: ${WS_PATH:-/tunnel}
    volumes:
      - ./docker/xray/config.template.json:/etc/xray/config.template.json:ro
      - ./docker/xray/entrypoint.sh:/entrypoint.sh:ro
    command: ["sh", "/entrypoint.sh"]

  echo:
    build: ./docker/echo
    container_name: wasm-tunnel-echo
    restart: unless-stopped
    ports:
      - "${ECHO_PORT:-8081}:8081"
    networks:
      default:
        # Static ULA so e2e can target IPv6 deterministically.
        ipv6_address: fd2c:4a98:9a2b::10

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
        - subnet: fd2c:4a98:9a2b::/64
          gateway: fd2c:4a98:9a2b::1
